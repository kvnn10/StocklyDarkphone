name: Fix product card language

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Localize product inventory KPI cards'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localize KPI cards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/products/ProductList.tsx')
          text = path.read_text()
          replacements = {
              'title="Estimated Sale Value"': 'title="Valor estimado de venta"',
              'description="Estimated sale value at current price"': 'description="Valor estimado de venta al precio actual"',
              'title="Inventory Value (Cost)"': 'title="Valor de inventario (costo)"',
              'description="Total inventory value at purchase cost"': 'description="Valor total del inventario al costo de compra"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/products/ProductList.tsx
          git rm .github/workflows/fix-product-card-language.yml
          git commit -m "Localize product inventory KPI cards"
          git push
