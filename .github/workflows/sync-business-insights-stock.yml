name: Sync Business Insights Stock Metrics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-stock-metrics:
    if: ${{ !contains(github.event.head_commit.message, 'sync business insights stock metrics') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Business Insights
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('components/Pages/BusinessInsightPage.tsx')
          text = path.read_text(encoding='utf-8')

          import_line = 'import { buildBusinessStockRollup } from "@/lib/insights/business-insights-stock-rollup";\n'
          if 'buildBusinessStockRollup' not in text:
              anchor = 'import {\n  buildWarehouseQuantityChartData,'
              text = text.replace(anchor, import_line + anchor, 1)

          old = '''    // CORRECTED: Total value calculation - sum of (price * quantity) for each product\n    const totalValue = filteredProducts.reduce((sum, product) => {\n      return sum + product.price * Number(product.quantity);\n    }, 0);'''
          new = '''    // Stock KPIs use the same source of truth as the Products table.\n    const stockRollup = buildBusinessStockRollup(filteredProducts);\n    const totalValue = stockRollup.totalValue;\n    const totalReserved = stockRollup.totalReserved;\n    const totalAvailable = stockRollup.totalAvailable;\n    const totalSold = stockRollup.totalSold;'''
          if old in text and 'const stockRollup = buildBusinessStockRollup(filteredProducts);' not in text:
              text = text.replace(old, new, 1)

          old_qty = '''    // CORRECTED: Total quantity - sum of all quantities\n    const totalQuantity = filteredProducts.reduce((sum, product) => {\n      return sum + Number(product.quantity);\n    }, 0);'''
          new_qty = '''    // Total physical quantity comes from the centralized stock rollup.\n    const totalQuantity = stockRollup.totalQuantity;'''
          if old_qty in text:
              text = text.replace(old_qty, new_qty, 1)

          old_low = '''    // CORRECTED: Low stock items - products with quantity > 0 AND quantity <= 20 (matching product table logic)\n    const lowStockItems = filteredProducts.filter(\n      (product) =>\n        Number(product.quantity) > 0 && Number(product.quantity) <= 20,\n    ).length;'''
          new_low = '''    // Low stock is based on sellable stock, not physically reserved units.\n    const lowStockItems = filteredProducts.filter((product) => {\n      const available = Math.max(0, (Number(product.quantity) || 0) - getDisplayCommittedQuantity(product));\n      return available > 0 && available <= 20;\n    }).length;'''
          if old_low in text:
              text = text.replace(old_low, new_low, 1)

          old_out = '''    // CORRECTED: Out of stock items - products with quantity = 0\n    const outOfStockItems = filteredProducts.filter(\n      (product) => Number(product.quantity) === 0,\n    ).length;'''
          new_out = '''    // Out of stock means no sellable units remain.\n    const outOfStockItems = filteredProducts.filter((product) => {\n      const available = Math.max(0, (Number(product.quantity) || 0) - getDisplayCommittedQuantity(product));\n      return available === 0;\n    }).length;'''
          if old_out in text:
              text = text.replace(old_out, new_out, 1)

          old_av = '''    const availableStockItems = filteredProducts.filter(\n      (product) => Number(product.quantity) > 20,\n    ).length;'''
          new_av = '''    const availableStockItems = filteredProducts.filter((product) => {\n      const available = Math.max(0, (Number(product.quantity) || 0) - getDisplayCommittedQuantity(product));\n      return available > 20;\n    }).length;'''
          if old_av in text:
              text = text.replace(old_av, new_av, 1)

          if 'getDisplayCommittedQuantity' not in text:
              anchor = 'import { buildBusinessStockRollup } from "@/lib/insights/business-insights-stock-rollup";\n'
              text = text.replace(anchor, anchor + 'import { getDisplayCommittedQuantity } from "@/lib/products/enrich-product-committed-quantity";\n', 1)

          marker = 'const stockRollup = buildBusinessStockRollup(filteredProducts);'
          if marker not in text:
              raise SystemExit('Patch did not apply: stock rollup marker missing')

          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Pages/BusinessInsightPage.tsx .github/workflows/sync-business-insights-stock.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: align business insights stock metrics"
          git push