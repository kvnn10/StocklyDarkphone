name: Fix Stockly Darkphone branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-branding.yml'

permissions:
  contents: write

jobs:
  fix-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply branding style
        run: |
          if [ ! -f .github/workflows/fix-branding.yml ]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('components/layouts/Navbar.tsx')
          s = p.read_text()
          old = '''<span className="mt-0.5 text-[11px] sm:text-xs font-medium tracking-tight text-gray-700 dark:text-gray-200">\n                Darkphone\n              </span>'''
          new = '''<span className="mt-0.5 text-[11px] sm:text-xs font-medium tracking-tight bg-gradient-to-r from-rose-600 to-gray-900 dark:from-rose-400 dark:to-gray-100 bg-clip-text text-transparent transition-all duration-300 ease-in-out group-hover:from-rose-700 group-hover:to-gray-950 dark:group-hover:from-rose-300 dark:group-hover:to-gray-50">\n                Darkphone\n              </span>'''
          if old not in s:
              raise SystemExit('Expected Darkphone span was not found; no changes made.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/layouts/Navbar.tsx .github/workflows/fix-branding.yml
          git rm .github/workflows/fix-branding.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: match Darkphone branding style"
          git push origin main
