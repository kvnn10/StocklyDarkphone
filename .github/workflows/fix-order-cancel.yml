name: Fix order cancellation without Stripe PaymentIntent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: allow manual paid order cancellation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch cancellation flow
        shell: python
        run: |
          from pathlib import Path

          path = Path('prisma/order.ts')
          text = path.read_text()

          old = '''  // A paid/partially-paid order must have a confirmed Stripe refund before
  // Stockly marks it as refunded. This prevents a false "refunded" state when
  // Stripe rejects the operation.
  let refundConfirmed = false;
  if (shouldRefund) {
    const paymentIntentId =
      orderWithItems.stripePaymentIntentId ??
      linkedInvoice?.stripePaymentIntentId;

    if (!paymentIntentId) {
      throw new Error(
        "No se puede cancelar una venta pagada o parcialmente pagada sin un PaymentIntent de Stripe para procesar el reembolso.",
      );
    }

    try {
      await createStripeRefund(paymentIntentId, "requested_by_customer");
      refundConfirmed = true;
    } catch (refundErr) {
      console.error("Stripe refund failed during order cancellation:", refundErr);
      throw new Error(
        "No se pudo procesar el reembolso en Stripe. La venta no fue cancelada para evitar inconsistencias.",
      );
    }
  }
'''

          new = '''  // Paid/partially-paid orders can come from Stripe or from a manual payment.
  // Stripe payments must be refunded through Stripe. Manual payments have no
  // PaymentIntent, so cancellation records a manual refund instead of blocking
  // the cancellation.
  let refundConfirmed = false;
  let manualRefundRequired = false;
  if (shouldRefund) {
    const paymentIntentId =
      orderWithItems.stripePaymentIntentId ??
      linkedInvoice?.stripePaymentIntentId;

    if (!paymentIntentId) {
      manualRefundRequired = true;
      logger.warn(
        "Cancelling paid order without Stripe PaymentIntent; recording manual refund",
        { orderId },
      );
    } else {
      try {
        await createStripeRefund(paymentIntentId, "requested_by_customer");
        refundConfirmed = true;
      } catch (refundErr) {
        console.error("Stripe refund failed during order cancellation:", refundErr);
        throw new Error(
          "No se pudo procesar el reembolso en Stripe. La venta no fue cancelada para evitar inconsistencias.",
        );
      }
    }
  }
'''

          if old not in text:
              raise SystemExit('Expected cancellation refund block was not found; refusing to patch.')
          text = text.replace(old, new, 1)

          old_status = '      paymentStatus: refundConfirmed ? "refunded" : orderWithItems.paymentStatus,\n'
          new_status = '      paymentStatus:\n        refundConfirmed || manualRefundRequired\n          ? "refunded"\n          : orderWithItems.paymentStatus,\n'
          if old_status not in text:
              raise SystemExit('Expected paymentStatus update was not found; refusing to patch.')
          text = text.replace(old_status, new_status, 1)

          old_cash = '''  if (refundConfirmed) {
    await recordCashRefund({
      orderId,
      userId,
      amount: Number(linkedInvoice?.amountPaid ?? orderWithItems.total),
      paymentMethod: "card",
    });
  }
'''
          new_cash = '''  if (refundConfirmed || manualRefundRequired) {
    await recordCashRefund({
      orderId,
      userId,
      amount: Number(linkedInvoice?.amountPaid ?? orderWithItems.total),
      paymentMethod: refundConfirmed ? "card" : "other",
    });
  }
'''
          if old_cash not in text:
              raise SystemExit('Expected refund cash-movement block was not found; refusing to patch.')
          text = text.replace(old_cash, new_cash, 1)

          path.write_text(text)
          print('Order cancellation patch applied.')

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-order-cancel.yml
          git add prisma/order.ts
          git commit -m "fix: allow manual paid order cancellation"
          git push
