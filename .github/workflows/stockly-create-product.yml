name: Stockly create product

on:
  workflow_dispatch:
    inputs:
      name:
        description: Product name
        required: true
        type: string
      sku:
        description: SKU
        required: true
        type: string
      price:
        description: Sale price
        required: true
        type: string
      quantity:
        description: Quantity
        required: true
        type: string
      category:
        description: Existing category name or ID
        required: true
        type: string
      supplier:
        description: Existing supplier name or ID
        required: true
        type: string

jobs:
  create-product:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write product queue file
        env:
          NAME: ${{ inputs.name }}
          SKU: ${{ inputs.sku }}
          PRICE: ${{ inputs.price }}
          QUANTITY: ${{ inputs.quantity }}
          CATEGORY: ${{ inputs.category }}
          SUPPLIER: ${{ inputs.supplier }}
        run: |
          set -euo pipefail
          mkdir -p automation/queue
          python - <<'PY'
          import json, os
          data = {
            "name": os.environ["NAME"],
            "sku": os.environ["SKU"],
            "price": float(os.environ["PRICE"]),
            "quantity": int(os.environ["QUANTITY"]),
            "category": os.environ["CATEGORY"],
            "supplier": os.environ["SUPPLIER"],
          }
          with open("automation/queue/manual-product.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit queue file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/queue/manual-product.json
          git commit -m "chore: queue manual Stockly product"
          git push

      - name: Wait for queue processor
        run: sleep 100

      - name: Verify queue was processed
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch automation/queue/manual-product.json >/dev/null 2>&1; then
            echo "Product queue file is still present. The Stockly processor did not complete successfully."
            exit 1
          fi
          echo "Queue file was removed by the processor; creation request completed successfully."
