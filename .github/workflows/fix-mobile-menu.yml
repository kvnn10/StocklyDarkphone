name: Fix mobile menu layering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-menu.yml'
      - 'components/layouts/Navbar.tsx'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile menu container
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/layouts/Navbar.tsx')
          s = p.read_text()
          old = 'className="xl:hidden border-t border-white/10 dark:border-white/10 bg-gradient-to-br from-white/95 via-white/90 to-white/85 dark:from-white/10 dark:via-white/10 dark:to-white/5 backdrop-blur-xl max-h-[calc(100vh-3.5rem)] overflow-y-auto"'
          new = 'className="xl:hidden absolute left-0 right-0 top-[72px] z-[60] border-t border-white/10 dark:border-white/10 bg-white/98 dark:bg-slate-950/98 backdrop-blur-xl max-h-[calc(100dvh-72px)] overflow-y-auto shadow-2xl"'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new in s:
              print('Mobile menu already patched')
          else:
              raise SystemExit('Mobile menu class not found; refusing unsafe edit')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- components/layouts/Navbar.tsx; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/layouts/Navbar.tsx
          git commit -m 'fix: prevent mobile menu content bleed-through'
          git push
